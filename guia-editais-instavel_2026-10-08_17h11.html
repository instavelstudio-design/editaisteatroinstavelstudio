  <div class="section-title"><span><span class="pill ok">${t} tenho</span> <span class="pill coral">${f} falta</span></span><span style="display:flex;gap:8px;flex-wrap:wrap">${p.docs.length&&DOC_SUG.some(([n])=>!p.docs.find(d=>d.nome===n))?`<button class="btn soft" data-a="docsug">Adicionar itens sugeridos que faltam</button>`:""}<button class="btn" data-a="docadd">+ Documento</button></span></div>
  ${p.docs.length?`<div class="card">${p.docs.map(d=>{const n=daysTo(d.vence);return `<div class="docrow"><input type="text" data-l="docs" data-id="${d.id}" data-f="nome" value="${esc(d.nome)}" aria-label="Documento">
   <div class="seg" role="group"><button class="t" data-a="docst" data-id="${d.id}" data-v="tenho" aria-pressed="${d.status==="tenho"}">Tenho</button><button class="f" data-a="docst" data-id="${d.id}" data-v="falta" aria-pressed="${d.status==="falta"}">Falta</button><button class="na" data-a="docst" data-id="${d.id}" data-v="na" aria-pressed="${d.status==="na"}">N/A</button></div>
   <label style="display:flex;flex-direction:column;font-size:.75rem;color:var(--ink-soft)">vence em<input type="date" data-l="docs" data-id="${d.id}" data-f="vence" value="${esc(d.vence)}"></label>
   <span style="display:flex;gap:6px;align-items:center">${d.vence?`<span class="pill ${n<0?"bad":n<=30?"warn":"ok"}">${n<0?"vencido":n+" dias"}</span>`:""}<button class="x" data-a="del" data-l="docs" data-id="${d.id}" aria-label="Apagar">✕</button></span></div>`}).join("")}</div>`:`<div class="empty"><h3>Lista vazia</h3><p>Carregue a lista com os documentos que os editais mais pedem.</p><button class="btn" data-a="docsug">Carregar lista sugerida</button></div>`}`;
}

/* ============ 8. CRONOGRAMA ============ */
function nextOct31(){const t=today();let d=new Date(t.getFullYear(),9,31);if(d<t)d=new Date(t.getFullYear()+1,9,31);return d}
function cronoSug(p){
  const t=today(); const E=pd(p.estreia)||addMonths(t,12);
  const r=(etapa,a,b)=>({id:uid("c"),etapa,inicio:iso(a),fim:iso(b),feito:false});
  const L=[];
  if(p.tipoDireito==="licenciada")L.push(r("Pedir licença e carta de intenção",t,addDays(t,30)));
  L.push(r("Escrever o projeto",t,addDays(t,25)));
  const o=nextOct31(); if(o<E)L.push(r("Inscrição na Rouanet (até 31/10)",addDays(o,-14),o));
  {const cs=addMonths(E,-11);L.push(r("Captação / resultado dos editais",cs<t?t:cs,addMonths(E,-4)))}
  if(p.tipoDireito==="licenciada")L.push(r("Tradução",addMonths(E,-9),addMonths(E,-5)));
  L.push(r("Elenco e equipe",addMonths(E,-5),addMonths(E,-4)));
  L.push(r("Pré-produção (cenário, figurino)",addMonths(E,-4),addMonths(E,-1)));
  L.push(r("Ensaios",addDays(E,-70),addDays(E,-1)));
  L.push(r("Divulgação e imprensa",addDays(E,-42),addDays(E,63)));
  L.push(r("Temporada 1 (4 semanas)",E,addDays(E,27)));
  L.push(r("Temporada 2 (4 semanas)",addDays(E,35),addDays(E,62)));
  L.push(r("Pós-produção e prestação de contas (até 60 dias)",addDays(E,63),addDays(E,120)));
  return L;
}
function vCronograma(){
  const p=cur(); const L=[...p.crono].sort((a,b)=>(a.inicio||"9").localeCompare(b.inicio||"9"));
  const dated=L.filter(c=>c.inicio&&c.fim);
  let gantt="";
  if(dated.length){
    let a=pd(dated.reduce((m,c)=>c.inicio<m?c.inicio:m,dated[0].inicio)), b=pd(dated.reduce((m,c)=>c.fim>m?c.fim:m,dated[0].fim));
    a=new Date(a.getFullYear(),a.getMonth(),1); b=new Date(b.getFullYear(),b.getMonth()+1,1);
    const span=b-a; const months=[]; for(let d=new Date(a);d<b;d=addMonths(d,1))months.push(d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")+"/"+String(d.getFullYear()).slice(2));
    const tp=(today()-a)/span*100;
    gantt=`<div class="gantt"><div class="gantt-inner"><div class="grow" style="border:0"><div></div><div class="gmonths">${months.map(m=>`<div>${m}</div>`).join("")}</div></div>
    ${dated.map(c=>{const l=(pd(c.inicio)-a)/span*100,w=Math.max(.8,(pd(c.fim)-pd(c.inicio)+864e5)/span*100);const late=!c.feito&&daysTo(c.fim)<0;return `<div class="grow"><div class="gl" title="${esc(c.etapa)}">${c.feito?"✓ ":""}${esc(c.etapa)}</div><div class="gtrack">${tp>=0&&tp<=100?`<div class="today" style="left:${tp}%"></div>`:""}<div class="gbar ${c.feito?"done":late?"late":""}" style="left:${l}%;width:${w}%" title="${fmtD(c.inicio)} – ${fmtD(c.fim)}"></div></div></div>`}).join("")}
    </div></div><small class="muted">Linha amarela = hoje. Roxo = planejado · verde = feito · coral = atrasado.</small>`;
  }
  return `<h2>Cronograma — ${esc(p.nome)}</h2><p class="lead">As etapas do projeto no tempo. ${p.estreia?`Estreia prevista: <b>${fmtD(p.estreia)}</b>.`:`Dica: coloque a data de estreia na <a href="#" data-a="edit">ficha</a> para as sugestões ficarem certas.`}</p>
  ${!L.length?`<div class="empty" style="margin:16px 0"><h3>Cronograma vazio</h3><p>Gere as etapas típicas de uma montagem, calculadas a partir da data de estreia. Depois ajuste.</p><button class="btn" data-a="cronosug">Gerar etapas sugeridas</button></div>`:gantt}
  <div class="section-title"><h3>Etapas</h3><button class="btn" data-a="cronoadd">+ Etapa</button></div>
  ${L.length?`<div class="card">${L.map(c=>`<div class="cronorow"><input type="checkbox" data-a="cronochk" data-id="${c.id}" ${c.feito?"checked":""} aria-label="Feito">
   <input type="text" data-l="crono" data-id="${c.id}" data-f="etapa" value="${esc(c.etapa)}" aria-label="Etapa">
   <label class="cr-d" style="font-size:.75rem;color:var(--ink-soft)">início<input type="date" data-l="crono" data-id="${c.id}" data-f="inicio" value="${esc(c.inicio)}"></label>
   <label class="cr-d" style="font-size:.75rem;color:var(--ink-soft)">fim<input type="date" data-l="crono" data-id="${c.id}" data-f="fim" value="${esc(c.fim)}"></label>
   <button class="x" data-a="del" data-l="crono" data-id="${c.id}" aria-label="Apagar">✕</button></div>`).join("")}</div>`:""}`;
}

/* ============ EVENTOS ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a],[data-tab]"); if(!t)return;
  const a=t.dataset.a, p=cur();
  if(!a&&t.dataset.tab){S.tab=t.dataset.tab;saveUI();render();window.scrollTo(0,0);return}
  if(t.tagName==="A")e.preventDefault();
  switch(a){
    case "mclose":closeModal();break;
    case "new":projectForm(null,true);break;
    case "edit":p&&projectForm(p,false);break;
    case "delproj":askConfirm(`Apagar o projeto "${p.nome}" e tudo dentro dele? Não dá para desfazer.`,()=>{const id=p.id;delete S.projects[id];dirty.delete(id);saveLocal();if(cloud)coll.doc(id).delete().catch(console.warn);S.cur=Object.keys(S.projects)[0]||null;saveUI();render();toast("Projeto apagado")});break;
    case "dupproj":{const c=normalize(JSON.parse(JSON.stringify(p)));c.id=uid("p");c.nome=p.nome+" (cópia)";c.criado=iso(new Date());c.cor="";c.inscricoes=[];S.projects[c.id]=c;S.cur=c.id;touch(c.id);saveUI();closeModal();render();toast("Projeto duplicado (sem as inscrições)");break}
    case "pick":S.cur=t.dataset.p;saveUI();render();break;
    case "go":S.cur=t.dataset.p;S.tab=t.dataset.tab;saveUI();render();window.scrollTo(0,0);break;
    case "tab":S.tab=t.dataset.tab;saveUI();render();window.scrollTo(0,0);break;
    case "edf":S.edFilter=t.dataset.f;saveUI();render();break;
    case "addins":{const ed=EDITAIS.find(x=>x.id===t.dataset.e);p.inscricoes.push({id:uid("i"),edital:ed?ed.nome:"",prazo:ed?ed.prazo:"",status:"preparando",valor:"",falta:"",resultado:""});touch();if(ed){toast("Adicionado às inscrições");S.tab="inscricoes";saveUI();window.scrollTo(0,0)}render();break}
    case "del":askConfirm("Apagar este item?",()=>{p[t.dataset.l]=p[t.dataset.l].filter(x=>x.id!==t.dataset.id);touch();render()});break;
    case "dirchk":{const k=t.dataset.k;p.direitos[k]=t.checked?(p.direitos[k]||iso(new Date())):"";touch();render();break}
    case "copytpl":copy(({en:emailEN,fu:emailFollow,pt:emailPT})[t.dataset.t](p));break;
    case "step":{const s=Number(t.dataset.s);if(s<0)break;S.step=s;saveUI();render();window.scrollTo(0,0);break}
    case "copyall":copy(fullText(p));break;
    case "puxadist":{const ta=document.getElementById("wizta");ta.value=(ta.value?ta.value+"\n\n":"")+distTexto(p);p.texto.distribuicao=ta.value;touch();updCounter();break}
    case "puxapub":{const pub=Math.round((p.lugares*(p.sessoesPagas+p.sessoesGratis))*(p.ocupacao||70)/100);const ta=document.getElementById("wizta");ta.value=(ta.value?ta.value+"\n\n":"")+`Estimativa: ${p.lugares} lugares × ${p.sessoesPagas+p.sessoesGratis} sessões × ${p.ocupacao||70}% de ocupação ≈ ${pub.toLocaleString("pt-BR")} espectadores.`;p.texto.publico=ta.value;touch();updCounter();break}
    case "orcsug":p.orcamento=ORC_SUG.map(([cat,item,un])=>({id:uid("o"),cat,item,qtd:1,ocorr:1,un,valor:"",fonte:FONTES[0]}));touch();render();break;
    case "orcadd":p.orcamento.push({id:uid("o"),cat:t.dataset.c,item:"",qtd:1,ocorr:1,un:"serviço",valor:"",fonte:FONTES[0]});touch();render();break;
    case "docsug":{const have=new Set(p.docs.map(d=>d.nome));DOC_SUG.forEach(([nome])=>{if(!have.has(nome))p.docs.push({id:uid("d"),nome,status:"falta",vence:""})});touch();render();toast("Lista atualizada");break}
    case "docadd":p.docs.push({id:uid("d"),nome:"",status:"falta",vence:""});touch();render();break;
    case "docst":{const d=p.docs.find(x=>x.id===t.dataset.id);d.status=t.dataset.v;touch();render();break}
    case "cronosug":p.crono=cronoSug(p);touch();render();break;
    case "cronoadd":p.crono.push({id:uid("c"),etapa:"Nova etapa",inicio:"",fim:"",feito:false});touch();render();break;
    case "cronochk":{const c=p.crono.find(x=>x.id===t.dataset.id);c.feito=t.checked;touch();render();break}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("projcard"))e.target.click()});
function onField(e,commit){
  const el=e.target; if(!el.closest("#view"))return;
  if(el.dataset.proj){const q=S.projects[el.dataset.proj];if(q){q[el.dataset.pfield]=el.value;touch(q.id)}return}
  const p=cur(); if(!p)return;
  if(el.dataset.step){p.texto[el.dataset.step]=el.value;touch();updCounter();return}
  if(el.dataset.dist){p.dist[el.dataset.dist]=el.value===""?"":Number(el.value);touch();if(commit)refreshDist();else if(S.tab==="orcamento")updateBudget();return}
  if(el.dataset.pf){const k=el.dataset.pf;p[k]=el.type==="number"?(el.value===""?"":Number(el.value)):el.value;touch();if(S.tab==="orcamento")updateBudget();if(commit&&(k==="ocupacao"||k==="meia"))refreshDist();return}
  if(el.dataset.dir){p.direitos[el.dataset.dir]=el.value;touch();if(commit&&el.type==="date")render();return}
  if(el.dataset.l&&el.dataset.id&&el.dataset.f){
    const it=p[el.dataset.l].find(x=>x.id===el.dataset.id); if(!it)return;
    it[el.dataset.f]=el.value; touch();
    if(S.tab==="orcamento")updateBudget();
    if(commit&&(el.tagName==="SELECT"||el.type==="date"))render();
  }
}
document.addEventListener("input",e=>onField(e,false));
document.addEventListener("change",e=>{
  if(e.target.id==="projSel"){S.cur=e.target.value;saveUI();render();return}
  if(e.target.dataset.a==="stepsel"){S.step=Number(e.target.value);saveUI();render();return}
  if(e.target.type==="checkbox")return;
  onField(e,true);
});
document.getElementById("btnNew").onclick=()=>projectForm(null,true);
document.getElementById("btnEdit").onclick=()=>cur()&&projectForm(cur(),false);

/* ============ BACKUP ============ */
function stamp(){const d=new Date();return iso(d)+"_"+String(d.getHours()).padStart(2,"0")+"h"+String(d.getMinutes()).padStart(2,"0")}
function buildHTML(){
  const head=[],body=[];
  document.querySelectorAll("[data-app]").forEach(el=>{
    let h;
    if(el.id==="dados")h='<script type="application/json" id="dados" data-app>'+JSON.stringify({savedAt:Date.now(),projects:S.projects}).replace(/</g,"\\u003c")+"<"+"/script>";
    else if(el.tagName==="MAIN")h='<main data-app><div class="wrap" id="view"></div></main>';
    else if(el.id=="modal")h='<div class="modal" id="modal" role="dialog" aria-modal="true" data-app><div class="card" id="modalBody"></div></div>';
    else if(el.id=="toast")h='<div class="toast" id="toast" data-app></div>';
    else h=el.outerHTML;
    (/^(TITLE|META|LINK|STYLE)$/.test(el.tagName)?head:body).push(h);
  });
  return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+head.join("\n")+'</head><body>'+body.join("\n")+'</body></html>';
}
async function offerFile(filename,data,mime){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename,data});toast("Arquivo salvo");return}
  }catch(e){if(e&&(e.code==="declined"||e.code==="rate_limited"))return;console.warn(e)}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("Download iniciado")}
  catch(e){toast("Não consegui baixar aqui")}
}
function backupModal(){
  const n=Object.keys(S.projects).length;
  openModal(`<h3>Backup</h3><p class="muted">${n} projeto(s) neste guia. ${cloud?"Seus dados estão salvos na nuvem da sua conta.":"Seus dados estão salvos só neste navegador — faça backup de vez em quando."}</p>
  <div class="bk"><div><b>Baixar o guia com meus dados</b><br><small class="muted">Um arquivo .html que abre em qualquer navegador já preenchido, mesmo sem internet. Alterações feitas nele ficam salvas naquele navegador.</small></div><button class="btn sm" data-a="dlhtml">Baixar .html</button></div>
  <div class="bk"><div><b>Baixar backup</b><br><small class="muted">Um arquivo .json com todos os projetos. Guarde no Drive ou no computador.</small></div><button class="btn sm" data-a="dljson">Baixar .json</button></div>
  <div class="bk"><div><b>Restaurar backup</b><br><small class="muted">Escolha um arquivo .json de backup. Projetos com o mesmo nome interno são substituídos; os outros são mantidos.</small><br><input type="file" id="bkfile" accept=".json,application/json" style="margin-top:8px;max-width:100%"></div></div>
  <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn soft" data-a="mclose">Fechar</button></div>`);
  document.getElementById("bkfile").onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      let data; try{data=JSON.parse(rd.result)}catch(_){toast("Arquivo inválido");return}
      const projs=data&&data.projects?data.projects:data;
      const list=projs&&typeof projs==="object"?Object.values(projs).filter(p=>p&&p.id&&p.nome):[];
      if(!list.length){toast("Nenhum projeto encontrado no arquivo");return}
      openModal(`<h3>Restaurar ${list.length} projeto(s)?</h3><p>${list.map(p=>esc(p.nome)).join(", ")}</p><p class="muted">Projetos iguais que já estão no guia serão substituídos pela versão do backup.</p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn soft" data-a="mclose">Cancelar</button><button class="btn" id="rsYes">Restaurar</button></div>`);
      document.getElementById("rsYes").onclick=()=>{list.forEach(p=>{S.projects[p.id]=normalize(JSON.parse(JSON.stringify(p)));touch(p.id)});if(!S.projects[S.cur])S.cur=list[0].id;saveUI();closeModal();render();toast("Backup restaurado")};
    };
    rd.readAsText(f);
  };
}
document.getElementById("btnBackup").onclick=backupModal;

/* ============ INÍCIO ============ */
(function boot(){
  let cache=lsGet(LS_KEY), local=null, emb=null;
  if(cache&&typeof cache==="object")local=cache.v===2?cache:{savedAt:0,projects:cache};
  try{emb=JSON.parse(document.getElementById("dados").textContent||"null")}catch(e){}
  const src=(emb&&emb.projects&&(!local||!Object.keys(local.projects||{}).length||(emb.savedAt||0)>(local.savedAt||0)))?emb:local;
  if(src&&src.projects)Object.values(src.projects).forEach(p=>{if(p&&p.id)S.projects[p.id]=normalize(p)});
  savedAt=src?src.savedAt||0:0;
  const ui=lsGet(LS_UI)||{}; Object.assign(S,{cur:ui.cur,tab:ui.tab||"painel",step:ui.step||0,edFilter:ui.edFilter||"todos"});
  if(!TABS.find(x=>x[0]===S.tab))S.tab="painel";
  if(!S.projects[S.cur])S.cur=Object.keys(S.projects)[0]||null;
  render(); initCloud();
})();
